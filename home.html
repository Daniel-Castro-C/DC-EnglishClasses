<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D.C English Classes — Área do aluno</title>
<link rel="stylesheet" href="style.css">
<style>
  .home-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-top:8px;}
  .home-card{
    background:var(--paper-card);border:1px solid var(--line);border-radius:12px;
    padding:26px;cursor:pointer;transition:border-color .15s, transform .15s;
  }
  .home-card:hover{border-color:var(--ink);transform:translateY(-2px);}
  .home-card .icon{
    width:44px;height:44px;border-radius:12px;background:var(--sky-soft);
    display:flex;align-items:center;justify-content:center;margin-bottom:14px;
  }
  .home-card .icon svg{width:22px;height:22px;display:block;}
  .home-card h3{margin:0 0 6px;font-size:17px;}
  .home-card p{margin:0;color:var(--text-soft);font-size:13.5px;line-height:1.5;}
  .welcome-avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;background:var(--sky-soft);}
  .welcome-row{display:flex;align-items:center;gap:16px;margin-bottom:34px;}
</style>
</head>
<body>

<div class="app-shell">
  <div class="sidebar">
    <div class="side-brand">
      <img class="logo" src="logo.png" alt="Logo">
      <div>
        <span>D.C English Classes</span>
        <small>Área do aluno</small>
      </div>
    </div>

    <div id="nav-container"></div>

    <div class="sidebar-foot">
      <button class="logout-link" onclick="signOutAndRedirect()">← Sair</button>
    </div>
  </div>

  <div class="main" id="main-content">
    <div class="empty-state">Carregando...</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/common.js"></script>
<script>
(async function init(){
  const session = await requireSession();
  if (!session) return;

  const profile = await getMyProfile(session.user.id);
  if (!profile) { await signOutAndRedirect(); return; }
  if (profile.role !== 'student') { window.location.href = 'admin.html'; return; }

  document.getElementById('nav-container').innerHTML = buildStudentTopNav('home');

  const firstName = (profile.full_name || profile.email || '').split(' ')[0];
  const avatar = profile.avatar_url
    ? `<img class="welcome-avatar" src="${profile.avatar_url}" alt="Foto">`
    : `<div class="welcome-avatar"></div>`;

  document.getElementById('main-content').innerHTML = `
    <div class="welcome-row">
      ${avatar}
      <div>
        <h1 style="margin:0;font-size:24px;">Olá, ${escapeHtml(firstName)}</h1>
        <div class="sub" style="color:var(--text-soft);font-size:13.5px;">Bem-vindo(a) à sua área do aluno</div>
      </div>
    </div>

    <div class="home-cards">
      <div class="home-card" onclick="window.location.href='perfil.html'">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="8" r="4" fill="#16213E"/>
            <path d="M4 20.5c0-4.14 3.58-6.5 8-6.5s8 2.36 8 6.5" fill="#5B93C4"/>
          </svg>
        </div>
        <h3>Perfil</h3>
        <p>Sua foto, seu nome, sua senha e o link fixo da sua aula.</p>
      </div>
      <div class="home-card" onclick="window.location.href='aluno.html'">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 5.5C10.2 4.4 7.8 4 5.5 4.3C4.6 4.4 4 5.2 4 6.1V18c0 1 .9 1.7 1.8 1.6c2.1-.3 4.3.1 6 1.2V5.5z" fill="#16213E"/>
            <path d="M12 5.5c1.8-1.1 4.2-1.5 6.5-1.2c.9.1 1.5.9 1.5 1.8V18c0 1-.9 1.7-1.8 1.6c-2.1-.3-4.3.1-6 1.2V5.5z" fill="#5B93C4"/>
          </svg>
        </div>
        <h3>Minhas aulas</h3>
        <p>Slides, PDFs, exercícios e relatórios de cada aula já dada.</p>
      </div>
      <div class="home-card" onclick="window.location.href='enviar-material.html'">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 3v12" stroke="#16213E" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M7.5 8.5L12 4l4.5 4.5" stroke="#5B93C4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3" stroke="#16213E" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </div>
        <h3>Enviar material</h3>
        <p>Quer usar algo específico na próxima aula? Envie aqui pro professor.</p>
      </div>
      <div class="home-card" onclick="window.location.href='financeiro.html'">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2.5" y="6" width="19" height="13" rx="2.5" fill="#16213E"/>
            <path d="M2.5 9.5h19" stroke="#EAF2FA" stroke-width="1.6"/>
            <rect x="5" y="13.5" width="6.5" height="2.2" rx="1.1" fill="#5B93C4"/>
          </svg>
        </div>
        <h3>Financeiro</h3>
        <p>Data de pagamento e valor da sua mensalidade.</p>
      </div>
    </div>
  `;
})();
</script>
<a href="https://wa.me/5527997411768" target="_blank" rel="noopener" class="whatsapp-fab">
  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.38 5.07L2 22l5.07-1.33A9.94 9.94 0 0012 22c5.52 0 10-4.48 10-10S17.52 2 12 2z" fill="#fff" fill-opacity="0"/>
    <path d="M17.47 14.38c-.28-.14-1.64-.81-1.9-.9-.25-.1-.44-.14-.62.14-.18.28-.71.9-.87 1.08-.16.18-.32.2-.6.07-.28-.14-1.18-.44-2.24-1.39-.83-.74-1.39-1.65-1.55-1.93-.16-.28-.02-.43.12-.57.13-.13.28-.32.42-.48.14-.16.18-.28.28-.46.09-.18.05-.35-.02-.49-.07-.14-.62-1.5-.85-2.06-.22-.53-.45-.46-.62-.47h-.53c-.18 0-.46.07-.71.35-.24.28-.93.91-.93 2.23s.95 2.59 1.08 2.77c.14.18 1.87 2.85 4.52 4 .63.27 1.12.44 1.5.56.63.2 1.2.17 1.65.1.5-.07 1.64-.67 1.87-1.32.23-.65.23-1.2.16-1.32-.07-.12-.25-.19-.53-.32z" fill="#fff"/>
  </svg>
  <span>Fale com o suporte do professor</span>
</a>

</body>
</html>
