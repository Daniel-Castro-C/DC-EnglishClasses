<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Portal do Aluno · Modo Visitante</title><link rel="stylesheet" href="portal.css"></head><body class="visitor-demo">
<div class="visitor-ribbon"><b>MODO VISITANTE · Dados exclusivamente demonstrativos</b><div><button type="button" id="restart-tour">↻ Reiniciar tour</button> <a href="./#horarios">Consultar horários →</a></div></div>
<button id="mobile-menu-btn" class="mobile-menu-btn" type="button">☰</button><div id="sidebar-backdrop" class="sidebar-backdrop"></div>
<div class="app-shell"><aside class="sidebar"><div class="side-brand"><img class="logo" src="https://raw.githubusercontent.com/Daniel-Castro-C/DC-EnglishClasses/main/logo.png" alt="D.C English Classes"><div><span>D.C English Classes</span><small>Portal do aluno</small></div></div>
<div class="lang-switcher"><div class="lang-switcher-label">Escolha o idioma</div><div class="lang-switcher-flags"><span class="lang-flag-btn active">🇧🇷</span><span class="lang-flag-btn">🇺🇸</span></div></div>
<button class="theme-toggle-btn" id="theme-btn">☾ Modo escuro</button>
<div id="visitor-nav"><div class="nav-label">Menu</div>
<button class="nav-item active" data-page="home"><span class="nav-icon">⌂</span><span class="nav-item-label">Início</span></button>
<button class="nav-item" data-page="lessons"><span class="nav-icon">▤</span><span class="nav-item-label">Minhas aulas</span></button>
<button class="nav-item" data-page="grammar"><span class="nav-icon">☷</span><span class="nav-item-label">Guias de Gramática</span></button>
<button class="nav-item" data-page="question"><span class="nav-icon">◉</span><span class="nav-item-label">Pergunte ao Daniel</span></button>
<button class="nav-item" data-page="upload"><span class="nav-icon">↑</span><span class="nav-item-label">Enviar material</span></button>
<button class="nav-item" data-page="profile"><span class="nav-icon">♙</span><span class="nav-item-label">Perfil</span></button>
</div><div class="sidebar-foot"><a class="logout-link" href="./">← Sair da demonstração</a></div></aside><main class="main" id="portal-content"></main></div>
<div id="visitor-tour-overlay" hidden></div><div class="visitor-tour-tooltip" id="tour-tooltip" role="dialog" aria-label="Tour guiado" hidden><span class="visitor-badge" id="tour-counter"></span><h3 id="tour-title"></h3><p id="tour-description"></p><div class="visitor-tour-step" id="tour-steps"></div><div style="display:flex;justify-content:flex-end;gap:7px"><button id="tour-skip">Pular</button><button id="tour-previous">Anterior</button><button class="primary" id="tour-next">Próximo →</button></div></div>
<script>
(function(){
const $=id=>document.getElementById(id),asset='https://raw.githubusercontent.com/Daniel-Castro-C/DC-EnglishClasses/main/';
let active='home',index=0,score=0,answered=false,tour=-1;
const questions=[['I usually ___ English after work.',['speak','speaks','speaking'],0,'Com I usamos speak no presente simples.'],['Which phrase is a polite request?',['Give me that!','Could you help me, please?','You help.'],1,'Could you help me, please? é um pedido educado.'],['I am interested ___ learning English.',['on','at','in'],2,'Usamos interested in.']];
const icon=(symbol)=>'<span class="nav-icon" aria-hidden="true">'+symbol+'</span>';
function closeSidebar(){document.querySelector('.sidebar').classList.remove('open');$('sidebar-backdrop').classList.remove('open');$('mobile-menu-btn').classList.remove('hide-while-open')}
function homepage(){return '<div class="home-dashboard"><header class="dashboard-heading" id="tour-home"><span class="dashboard-kicker">SEU ESPAÇO DE APRENDIZAGEM</span><div class="welcome-row"><div class="welcome-avatar"></div><div><h1>Olá, visitante!</h1><p class="dashboard-lead">Seu inglês continua evoluindo. Escolha por onde começar hoje.</p></div></div></header>'+
'<div class="achievements-wall" id="tour-achievements"><div class="achievements-wall-title">Mural de conquistas</div><div class="achievements-row"><img class="badge-icon badge-current" src="'+asset+'badges/badge-10.png" alt="Conquista de dez aulas"><div class="achievement-next"><img class="badge-icon badge-locked" src="'+asset+'badges/badge-30.png" alt="Próxima conquista de trinta aulas"><div class="achievement-progress"><div class="achievement-progress-fill" style="width:35%"></div></div></div></div></div>'+
'<section class="dashboard-hero" id="tour-continue"><div class="dashboard-hero-copy"><span class="dashboard-hero-kicker">CONTINUE APRENDENDO</span><h2>Seu aprendizado continua aqui.</h2><p>Encontre seus conteúdos e continue praticando fora da aula.</p></div><button class="dashboard-hero-action" data-page="lessons">Ver minhas aulas →</button></section>'+
'<div class="dashboard-section-heading"><h2>Acesso rápido</h2><span>17 aulas realizadas · exemplo</span></div><div class="home-cards" id="tour-links"><button class="home-card" data-page="lessons">'+icon('▤')+'<h3>Minhas aulas</h3><p>Slides, PDFs, exercícios e relatórios de desempenho de cada aula realizada.</p><span class="home-card-link">Explorar →</span></button><button class="home-card" data-page="grammar">'+icon('☷')+'<h3>Guias de Gramática</h3><p>Materiais de gramática organizados por nível.</p><span class="home-card-link">Explorar →</span></button><button class="home-card" data-page="question">'+icon('◉')+'<h3>Pergunte ao Daniel</h3><p>Tire dúvidas de inglês também fora da aula.</p><span class="home-card-link">Explorar →</span></button></div>'+
'<div class="dashboard-quick-links"><a href="#" data-page="upload">↑ Enviar material →</a><a href="#" data-page="profile">Perfil →</a></div><div class="home-bottom-grid"><section class="dashboard-recent-panel"><h2>Materiais recentes</h2><div class="recent-resource"><span class="recent-resource-details"><strong>Everyday Conversations</strong><small>Aula 17 · Demonstrativa</small></span><span class="recent-resource-type">Exercícios</span></div><button class="btn-ghost" data-page="lessons">Explorar material demonstrativo →</button></section><div id="word-of-day-container"><div class="word-of-day-card"><div class="word-of-day-circle"></div><div class="word-of-day-label">WORD OF THE DAY</div><div class="word-of-day-term">Confidence</div><div class="word-of-day-definition">Belief in your ability to succeed.</div><div class="word-of-day-example">“I feel more confident when I practice.”</div></div></div></div></div>'}
function lessons(){return '<div class="topline"><h1>Minhas aulas</h1><p>Slides, PDFs, exercícios e relatórios organizados por aula.</p></div><section class="box" id="tour-material"><h2>Everyday Conversations</h2><p class="demo-hint">Aula 17 · Exemplo demonstrativo, sem dados de alunos.</p><div class="demo-list-row"><div><h3>Apresentação da aula</h3><p>Conteúdo utilizado durante a aula</p></div><span class="visitor-badge">Slides</span></div><div class="demo-list-row"><div><h3>Exercícios de conversação</h3><p>Pratique vocabulário e gramática em contexto.</p></div><button class="btn-dark-sm" data-page="quiz">Experimentar →</button></div><div class="demo-list-row"><div><h3>Relatório de desempenho</h3><p>Acompanhamento após cada aula</p></div><span class="visitor-badge">PDF</span></div></section>'}
const pages={grammar:'<div class="topline"><h1>Guias de Gramática</h1></div><section class="box"><h2>Materiais de apoio</h2><p>Revise Present Simple, Past Simple e outros conteúdos por nível.</p><p class="demo-hint">Exemplos fictícios.</p></section>',question:'<div class="topline"><h1>Pergunte ao Daniel</h1></div><section class="box"><h2>Dúvidas de inglês</h2><p>Em sua conta de aluno, envie dúvidas e acompanhe as respostas.</p><div class="demo-list-row"><div><h3>Qual a diferença entre say e tell?</h3><p>Dúvida fictícia, respondida.</p></div><span class="visitor-badge">Respondida</span></div></section>',upload:'<div class="topline"><h1>Enviar material</h1></div><section class="box"><h2>Sugestões para as aulas</h2><p>O aluno pode enviar assuntos e materiais para serem trabalhados nas aulas.</p><p class="demo-hint">O envio está desabilitado nesta demonstração.</p></section>',profile:'<div class="topline"><h1>Perfil</h1></div><section class="box"><h2>Meu perfil</h2><p>Visitante de demonstração</p><p class="demo-hint">Os dados e informações reais de alunos ficam protegidos.</p></section>'};
function quiz(){if(index>=questions.length){$('portal-content').innerHTML='<div class="topline"><h1>Atividade concluída</h1></div><section class="visitor-quiz"><h2>Parabéns! 🎉</h2><p>Você acertou '+score+' de '+questions.length+' questões.</p><button class="btn-dark-sm" id="again">Refazer</button> <button class="btn-ghost" data-page="lessons">Voltar para as aulas</button></section>';return}let q=questions[index];$('portal-content').innerHTML='<div class="topline"><h1>Everyday Conversations</h1><p>Atividade demonstrativa</p></div><section class="visitor-quiz" id="tour-quiz"><span class="visitor-badge">Questão '+(index+1)+' de '+questions.length+'</span><h3>'+q[0]+'</h3>'+q[1].map((o,i)=>'<button class="quiz-choice" data-answer="'+i+'">'+o+'</button>').join('')+'<p class="visitor-choice-feedback" id="feedback">Escolha uma resposta.</p><button id="next-question" class="btn-dark-sm" disabled>Próxima →</button></section>';$('next-question').onclick=()=>{index++;quiz()};answered=false}
function show(p){active=p;document.querySelectorAll('#visitor-nav [data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));if(p==='quiz'){index=0;score=0;quiz()}else $('portal-content').innerHTML=p==='home'?homepage():p==='lessons'?lessons():pages[p]||homepage();closeSidebar();window.scrollTo(0,0)}
const steps=[['home','#tour-home','Bem-vindo ao seu portal','Conheça o ambiente real do aluno com informações fictícias.'],['home','#tour-achievements','Conquistas','O mural mostra sua evolução ao longo das aulas.'],['home','#tour-continue','Continue aprendendo','Tenha seus conteúdos sempre à mão.'],['lessons','#tour-material','Materiais da aula','Aqui ficam slides, exercícios e relatórios de desempenho.'],['quiz','#tour-quiz','Material interativo','Experimente uma atividade com correção imediata.'],['home','#visitor-nav','Explore os menus','Navegue livremente e, ao concluir, consulte os horários disponíveis na landing page.']];
function finishTour(){tour=-1;$('visitor-tour-overlay').hidden=true;$('tour-tooltip').hidden=true;document.querySelectorAll('.visitor-tour-focus').forEach(x=>x.classList.remove('visitor-tour-focus'))}
function updateTour(){let st=steps[tour];show(st[0]);$('visitor-tour-overlay').hidden=false;$('tour-tooltip').hidden=false;$('tour-counter').textContent='PASSO '+(tour+1)+' DE '+steps.length;$('tour-title').textContent=st[2];$('tour-description').textContent=st[3];$('tour-steps').innerHTML=steps.map((_,i)=>'<i class="'+(i<=tour?'on':'')+'"></i>').join('');$('tour-previous').disabled=tour===0;$('tour-next').textContent=tour===steps.length-1?'Finalizar ✓':'Próximo →';requestAnimationFrame(()=>{let el=document.querySelector(st[1]);if(!el)return;el.scrollIntoView({block:'nearest'});el.classList.add('visitor-tour-focus');let rect=el.getBoundingClientRect();let tip=$('tour-tooltip');tip.style.left=Math.max(17,Math.min(innerWidth-380,rect.right+14))+'px';tip.style.top=Math.max(14,Math.min(innerHeight-285,rect.top))+'px'})}
function startTour(){tour=0;updateTour()}$('tour-skip').onclick=finishTour;$('tour-previous').onclick=()=>{tour=Math.max(0,tour-1);updateTour()};$('tour-next').onclick=()=>{if(tour===steps.length-1)finishTour();else{tour++;updateTour()}};$('restart-tour').onclick=startTour;
$('mobile-menu-btn').onclick=()=>{document.querySelector('.sidebar').classList.toggle('open');$('sidebar-backdrop').classList.toggle('open');$('mobile-menu-btn').classList.toggle('hide-while-open')};$('sidebar-backdrop').onclick=closeSidebar;
$('theme-btn').onclick=()=>{document.body.classList.toggle('dark-mode');$('theme-btn').textContent=document.body.classList.contains('dark-mode')?'☀ Modo claro':'☾ Modo escuro'};
document.addEventListener('click',e=>{const link=e.target.closest('[data-page]');if(link){e.preventDefault();if(tour>=0)finishTour();show(link.dataset.page);return}let q=e.target.closest('[data-answer]');if(q&&!answered){answered=true;let answer=Number(q.dataset.answer),question=questions[index];if(answer===question[2])score++;$('feedback').textContent=(answer===question[2]?'✓ Correto! ':'Vamos revisar. ')+question[3];document.querySelectorAll('[data-answer]').forEach(b=>b.disabled=true);$('next-question').disabled=false}if(e.target.id==='again'){index=0;score=0;quiz()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&tour>=0)finishTour()});show('home');startTour();
})();
</script></body></html>
