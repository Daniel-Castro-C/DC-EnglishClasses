<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><title>Portal DC · Minha jornada — prévia</title><link rel="stylesheet" href="style.css"><meta name="robots" content="noindex"></head><body>
<main class="main"><div class="box"><h1>Minha jornada — teste isolado</h1><p>Dados fictícios. Nenhuma informação será gravada. Use os controles para simular o desbloqueio dos guias, publicação da retrospectiva e notificações.</p><div class="row"><button class="btn-ghost" onclick="unlocked=!unlocked;draw()">Desbloquear/bloquear Grammar Guides</button><button class="btn-ghost" onclick="published=!published;draw()">Publicar/retirar retrospectiva</button><button class="btn-ghost" onclick="document.body.classList.toggle('dark-mode')">Alternar tema</button></div></div>
<div class="home-dashboard"><div id="journey"></div><div id="retrospective"></div><div style="max-width:280px;background:#152442;padding:13px;border-radius:9px" id="notifs"></div><div class="box" style="margin-top:16px"><button class="btn-ghost" onclick="notifications=0;draw()">Simular leitura das notificações</button><button class="btn-ghost" onclick="notifications=1;draw()">Simular novos avisos</button></div></div>
</main><script src="js/common.js"></script><script src="js/student-journey.js"></script><script>
let unlocked=false,published=false,notifications=1;
function draw(){document.getElementById('journey').innerHTML=StudentJourney.render({completed:38,saved:24,guides:7,badges:2,grammarUnlocked:unlocked});document.getElementById('retrospective').innerHTML=published?StudentJourney.render({completed:38,saved:24,guides:7,badges:2,grammarUnlocked:unlocked},'pt',2026):'';document.getElementById('notifs').innerHTML=studentNotificationCenter(notifications?{materials:2,reports:1,questions:1,writing:1}:{});document.querySelector('.student-notification-center').open=true;}
draw();
</script></body></html>
