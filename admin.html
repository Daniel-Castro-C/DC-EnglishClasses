<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D.C English Classes — Painel do professor</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin-crm.css">
<link rel="icon" type="image/png" href="logo.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16213E">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="admin-crm">
<script>(function(){try{if(localStorage.getItem('portal_theme')==='dark')document.body.classList.add('dark-mode');}catch(e){}})();</script>

<button id="mobile-menu-btn" class="mobile-menu-btn" onclick="toggleMobileSidebar()">☰</button>
<div id="sidebar-backdrop" class="sidebar-backdrop" onclick="closeMobileSidebar()"></div>
<div class="app-shell">
  <div class="sidebar">
    <div class="side-brand">
      <img class="logo" src="logo.png" alt="Logo">
      <div>
        <span>D.C English Classes</span>
        <small>Painel do professor</small>
      </div>
    </div>

    <button type="button" class="teacher-test-launch" onclick="enterStudentTestMode()" aria-label="Abrir modo aluno de teste">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19h16M6 19V8l6-4 6 4v11M9 10h6M12 10v7"/></svg>
      <span>Modo Aluno de Teste<small>Visualizar como aluno</small></span>
      <span aria-hidden="true">→</span>
    </button>
    <div id="theme-toggle-container"></div>

    <div id="nav-container"><div class="nav-label">Carregando...</div></div>

    <div class="sidebar-foot">
      <button class="logout-link" onclick="signOutAndRedirect()">← Sair</button>
    </div>
  </div>

  <div class="main" id="main-content">
    <div class="empty-state">Carregando...</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/emailConfig.js"></script>
<script src="js/common.js"></script>
<script src="js/admin-calendar-test.js"></script>
<script src="js/admin-turmas-preview.js"></script>
<script src="js/admin-calendar-lessons.js"></script>
<script src="js/admin.js"></script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>

</body>
</html>
