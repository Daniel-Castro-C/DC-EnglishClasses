<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Auditoria de responsividade</title><style>body{font:14px system-ui;margin:20px}table{border-collapse:collapse;width:100%}th,td{padding:6px;border:1px solid #ccc;text-align:left}#frames{overflow:auto}iframe{display:block;height:850px;border:1px solid #aaa;margin-bottom:10px}select,button{font:inherit;padding:8px}pre{white-space:pre-wrap}</style></head><body><h1>Auditoria de responsividade e carregamento</h1><p>Dados demonstrativos. Sem envio de formulário. Medições de navegação em iframe real; cache e rede podem variar, não são Core Web Vitals de usuários reais.</p><label>Página <select id="page"></select></label> <label>Largura <select id="width"><option>320</option><option>390</option><option>768</option><option>1024</option><option>1440</option></select></label> <button id="inspect">Inspecionar página</button> <button id="run">Executar todos os testes</button><p id="status" role="status">Pronto.</p><table><thead><tr><th>Página</th><th>Viewport</th><th>Excesso horizontal</th><th>DOM</th><th>Load</th><th>Possíveis elementos</th></tr></thead><tbody id="results"></tbody></table><div id="frames"></div><script>
const root=location.pathname.endsWith('/tests/responsive-probe.html')?'../':'./';
const isLanding=location.pathname.endsWith('/responsive-probe.html')&&!location.pathname.includes('/tests/');
const cases=isLanding?['index.html','disponibilidade.html','admin.html','visit/home.html','visit/aluno.html','visit/perfil.html','visit/recursos.html','visit/enviar-material.html','visit/pergunte-ao-daniel.html']:['index.html','calendar-preview.html','calendar-preview.html?theme=dark','admin-home-calendar-preview.html','student-journey-preview.html','student-resources-preview.html'];
const widths=[320,390,768,1024,1440],page=document.getElementById('page'),width=document.getElementById('width'),frameRoot=document.getElementById('frames'),results=document.getElementById('results'),status=document.getElementById('status');
cases.forEach(v=>page.add(new Option(v,v)));
async function sample(path,w,keep){
 const frame=document.createElement('iframe');frame.title=path+' '+w;frame.style.width=w+'px';frame.src=root+path;frameRoot.replaceChildren(frame);
 await new Promise(resolve=>{const timer=setTimeout(resolve,12000);frame.onload=()=>{clearTimeout(timer);resolve()};});
 // Give asynchronous fixture UI time to render; Navigation Timing excludes this settling interval.
 await new Promise(resolve=>setTimeout(resolve,650));
 let row;
 try{const d=frame.contentDocument,win=frame.contentWindow,n=win.performance.getEntriesByType('navigation')[0];const vw=d.documentElement.clientWidth,sw=d.documentElement.scrollWidth;
 const offenders=[...d.querySelectorAll('body *')].filter(el=>{const r=el.getBoundingClientRect();return r.width>0&&r.right>vw+3&&win.getComputedStyle(el).position!=='fixed'&&!el.closest('[hidden],.hidden,.crm-table-wrap,.schedule-scroll')}).map(e=>e.tagName+'.'+String(e.className||'').split(' ').slice(0,2).join('.')).filter((v,i,a)=>a.indexOf(v)===i).slice(0,5);
 row=[path,w,Math.max(0,sw-vw),Math.round(n?.domContentLoadedEventEnd||0),Math.round(n?.loadEventEnd||0),offenders.join(', ')]}
 catch(e){row=[path,w,'erro','—','—',String(e.message)]}
 const tr=document.createElement('tr');row.forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.append(td)});results.append(tr);
 if(!keep)frame.remove();
}
document.getElementById('inspect').onclick=async()=>{status.textContent='Inspecionando…';await sample(page.value,+width.value,true);status.textContent='Inspeção concluída.'};
document.getElementById('run').onclick=async()=>{results.replaceChildren();document.querySelectorAll('button').forEach(b=>b.disabled=true);for(let i=0;i<cases.length;i++)for(let j=0;j<widths.length;j++){status.textContent='Testando '+(i*widths.length+j+1)+' de '+cases.length*widths.length;await sample(cases[i],widths[j],false)}status.textContent='Concluído.';document.querySelectorAll('button').forEach(b=>b.disabled=false)};
</script></body></html>
