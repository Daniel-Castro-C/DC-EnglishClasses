<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D.C English Classes — Perfil</title>
<link rel="stylesheet" href="style.css">
<style>
  .avatar-row{display:flex;align-items:center;gap:20px;margin-bottom:10px;}
  .avatar-preview{width:76px;height:76px;border-radius:50%;object-fit:cover;background:var(--sky-soft);border:1px solid var(--line);}
  .feedback{font-size:13px;margin-top:8px;display:none;}
  .feedback.show{display:block;}
  .feedback.ok{color:var(--sage);}
  .feedback.err{color:var(--danger);}
</style>
</head>
<body>

<div class="app-shell">
  <div class="sidebar">
    <div class="side-brand">
      <img class="logo" src="logo.png" alt="Logo">
      <div>
        <span>D.C English Classes</span>
        <small>Área do aluno</small>
      </div>
    </div>

    <div id="nav-container"></div>

    <div class="sidebar-foot">
      <button class="logout-link" onclick="signOutAndRedirect()">← Sair</button>
    </div>
  </div>

  <div class="main" id="main-content">
    <div class="empty-state">Carregando...</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/common.js"></script>
<script src="js/perfil.js"></script>
</body>
</html>
