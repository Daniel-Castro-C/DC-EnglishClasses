<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal DC — prévia do dia de aula</title><link rel="stylesheet" href="style.css"></head>
<body><main class="main"><div class="home-dashboard">
<header class="dashboard-heading"><span class="dashboard-kicker">Portal do aluno · prévia visual</span><h1>Bem-vindo, Aluno!</h1><p class="dashboard-lead">Teste isolado com o mesmo componente da Home, sem conexão ao banco de dados.</p></header>
<div class="box"><div class="row"><button type="button" class="btn-ghost" id="ordinary">Dia sem aula</button><button type="button" class="btn-primary" id="lesson">Dia de aula</button><button type="button" class="btn-ghost" id="theme">Alternar tema</button></div></div>
<div id="home-lesson-call-container"></div><section class="dashboard-hero"><div class="dashboard-hero-copy"><span class="dashboard-hero-kicker">Continue aprendendo</span><h2>Seu inglês, um passo de cada vez.</h2><p>Estude os materiais das suas aulas.</p></div></section>
</div></main><script src="js/common.js"></script><script src="js/home-lesson-call.js"></script><script>
const demoProfile={role:'student',is_test_profile:true};function selectDay(today){updateHomeLessonCall(demoProfile,today);document.getElementById('ordinary').setAttribute('aria-pressed',String(!today));document.getElementById('lesson').setAttribute('aria-pressed',String(today));}
document.getElementById('ordinary').onclick=()=>selectDay(false);document.getElementById('lesson').onclick=()=>selectDay(true);document.getElementById('theme').onclick=()=>document.body.classList.toggle('dark-mode');selectDay(true);
</script></body></html>
