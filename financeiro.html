<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D.C English Classes — Financeiro</title>
<link rel="stylesheet" href="style.css">
<style>
  .fin-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:8px;}
  .fin-box{background:var(--paper-card);border:1px solid var(--line);border-radius:12px;padding:26px;}
  .fin-box .label{font-size:13px;color:var(--text-soft);margin-bottom:8px;}
  .fin-box .value{font-size:28px;font-family:'Baskerville Old Face','Libre Baskerville',Georgia,serif;color:var(--ink);}
</style>
</head>
<body>

<div class="app-shell">
  <div class="sidebar">
    <div class="side-brand">
      <img class="logo" src="logo.png" alt="Logo">
      <div>
        <span>D.C English Classes</span>
        <small>Área do aluno</small>
      </div>
    </div>

    <div id="nav-container"></div>

    <div class="sidebar-foot">
      <button class="logout-link" onclick="signOutAndRedirect()">← Sair</button>
    </div>
  </div>

  <div class="main" id="main-content">
    <div class="empty-state">Carregando...</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/common.js"></script>
<script>
(async function init(){
  const session = await requireSession();
  if (!session) return;

  const profile = await getMyProfile(session.user.id);
  if (!profile) { await signOutAndRedirect(); return; }
  if (profile.role !== 'student') { window.location.href = 'admin.html'; return; }

  document.getElementById('nav-container').innerHTML = buildStudentTopNav('financeiro');

  const hasInfo = profile.payment_day || profile.monthly_fee;

  document.getElementById('main-content').innerHTML = `
    <div class="topline">
      <div>
        <h1>Financeiro</h1>
        <div class="sub">Data de pagamento e valor da sua mensalidade</div>
      </div>
    </div>
    ${!hasInfo ? `
      <div class="empty-state">Seu professor ainda não configurou essas informações.</div>
    ` : `
      <div class="fin-grid">
        <div class="fin-box">
          <div class="label">Dia de pagamento</div>
          <div class="value">${profile.payment_day ? 'Todo dia ' + profile.payment_day : '—'}</div>
        </div>
        <div class="fin-box">
          <div class="label">Valor da mensalidade</div>
          <div class="value">${profile.monthly_fee ? formatCurrencyBRL(profile.monthly_fee) : '—'}</div>
        </div>
      </div>
    `}
  `;
})();
</script>
<a href="https://wa.me/5527997411768" target="_blank" rel="noopener" class="whatsapp-fab">
  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.38 5.07L2 22l5.07-1.33A9.94 9.94 0 0012 22c5.52 0 10-4.48 10-10S17.52 2 12 2z" fill="#fff" fill-opacity="0"/>
    <path d="M17.47 14.38c-.28-.14-1.64-.81-1.9-.9-.25-.1-.44-.14-.62.14-.18.28-.71.9-.87 1.08-.16.18-.32.2-.6.07-.28-.14-1.18-.44-2.24-1.39-.83-.74-1.39-1.65-1.55-1.93-.16-.28-.02-.43.12-.57.13-.13.28-.32.42-.48.14-.16.18-.28.28-.46.09-.18.05-.35-.02-.49-.07-.14-.62-1.5-.85-2.06-.22-.53-.45-.46-.62-.47h-.53c-.18 0-.46.07-.71.35-.24.28-.93.91-.93 2.23s.95 2.59 1.08 2.77c.14.18 1.87 2.85 4.52 4 .63.27 1.12.44 1.5.56.63.2 1.2.17 1.65.1.5-.07 1.64-.67 1.87-1.32.23-.65.23-1.2.16-1.32-.07-.12-.25-.19-.53-.32z" fill="#fff"/>
  </svg>
  <span>Fale com o suporte do professor</span>
</a>

</body>
</html>
