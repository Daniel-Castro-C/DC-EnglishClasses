<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D.C English Classes — Recuperar senha</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login-screen">
  <div class="login-brand">
    <div class="brand-top">
      <img class="logo" src="logo.png" alt="Logo">
      <span>D.C English Classes</span>
    </div>
    <div class="brand-text-wrap">
      <h1>Vamos recuperar seu acesso.</h1>
      <p>Digite seu e-mail cadastrado e enviaremos um link para você criar uma nova senha.</p>
    </div>
  </div>

  <div class="login-form-side">
    <div class="login-box">
      <h2>Esqueci minha senha</h2>
      <div class="sub">Informe o e-mail usado no cadastro</div>

      <div id="msg-box" class="form-error"></div>

      <label for="email-input">E-mail</label>
      <input id="email-input" type="email" placeholder="voce@email.com">

      <button id="send-btn" class="btn-primary" onclick="sendReset()">Enviar link de recuperação</button>
      <div class="small-note"><a href="index.html" style="color:var(--ink);">← Voltar para o login</a></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script>
function showMsg(msg, ok){
  const el = document.getElementById('msg-box');
  el.textContent = msg;
  el.style.background = ok ? '#E7F0E8' : '#FBEAE6';
  el.style.color = ok ? 'var(--sage)' : 'var(--danger)';
  el.classList.add('show');
}

async function sendReset(){
  const email = document.getElementById('email-input').value.trim();
  if (!email) { showMsg('Digite seu e-mail.', false); return; }

  const btn = document.getElementById('send-btn');
  btn.disabled = true;
  btn.textContent = 'Enviando...';

  const redirectTo = window.location.origin + '/atualizar-senha.html';
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo });

  btn.disabled = false;
  btn.textContent = 'Enviar link de recuperação';

  // Por segurança, mostramos a mesma mensagem mesmo se o e-mail não existir no sistema.
  showMsg('Se este e-mail estiver cadastrado, você vai receber um link para criar uma nova senha. Verifique também a caixa de spam.', true);
}
</script>
</body>
</html>
