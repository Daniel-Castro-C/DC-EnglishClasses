<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>D.C English Classes — Pergunte ao Daniel</title>
<link rel="stylesheet" href="style.css">
<style>
  .feedback{font-size:13px;margin-top:12px;display:none;}
  .feedback.show{display:block;}
  .feedback.ok{color:var(--sage);}
  .feedback.err{color:var(--danger);}
  textarea{
    width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:7px;
    margin-bottom:16px;font-family:inherit;font-size:14px;background:#fff;resize:vertical;min-height:110px;
  }
  .answer-box{
    background:var(--sky-soft);border-radius:8px;padding:16px 18px;margin-top:14px;
  }
  .answer-box .label{font-size:12px;color:var(--text-soft);margin-bottom:6px;}
  .waiting-note{color:var(--text-soft);font-size:13.5px;margin-top:14px;font-style:italic;}
</style>
</head>

  <div class="sidebar">
    <div class="side-brand">
      <img class="logo" src="logo.png" alt="Logo">
      <div>
        <span>D.C English Classes</span>
        <small>Área do aluno</small>
      </div>
    </div>

    <div id="nav-container"></div>

    <div class="sidebar-foot">
      <button class="logout-link" onclick="signOutAndRedirect()">← Sair</button>
    </div>
  </div>

  <div class="main" id="main-content">
    <div class="empty-state">Carregando...</div>
  </div>
</div>
