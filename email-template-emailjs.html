<!--
  ==========================================================
  TEMPLATE DE E-MAIL — D.C English Classes
  ==========================================================
  Como usar:
  1. No painel do EmailJS, vá em Email Templates > abra seu template.
  2. Troque para o modo "Code Editor" (ou "</> Code", dependendo da versão).
  3. Apague o conteúdo atual e cole este arquivo inteiro no lugar.
  4. Troque "SEU-SITE.vercel.app" (aparece 1 vez, no link do logo) pelo endereço
     de verdade do seu site.
  5. Salve.

  As variáveis {{to_name}}, {{message}} e {{subject}} continuam funcionando
  exatamente como antes — não precisa mudar nada no código do site.
-->
<div style="background-color:#EAF2FA; padding:32px 16px; font-family:Arial, Helvetica, sans-serif;">
  <table role="presentation" width="100%" style="max-width:520px; margin:0 auto; border-collapse:collapse; background-color:#ffffff; border-radius:12px; overflow:hidden; box-shadow:0 2px 10px rgba(22,33,62,0.08);">

    <!-- Cabeçalho -->
    <tr>
      <td style="background-color:#16213E; padding:24px 28px;">
        <table role="presentation" width="100%" style="border-collapse:collapse;">
          <tr>
            <td style="vertical-align:middle;">
              <img src="https://SEU-SITE.vercel.app/logo.png" alt="D.C English Classes" width="36" height="36" style="border-radius:6px; display:block;">
            </td>
            <td style="vertical-align:middle; padding-left:12px;">
              <span style="color:#ffffff; font-size:16px; font-weight:bold;">D.C English Classes</span>
            </td>
          </tr>
        </table>
      </td>
    </tr>

    <!-- Corpo -->
    <tr>
      <td style="padding:32px 28px;">
        <p style="margin:0 0 16px; font-size:15px; color:#23262B; line-height:1.6;">
          Olá, <strong>{{to_name}}</strong>,
        </p>
        <p style="margin:0 0 24px; font-size:15px; color:#23262B; line-height:1.6;">
          {{message}}
        </p>

        <table role="presentation" style="border-collapse:collapse; margin-bottom:8px;">
          <tr>
            <td style="background-color:#16213E; border-radius:7px;">
              <a href="https://SEU-SITE.vercel.app" style="display:inline-block; padding:12px 22px; font-size:14px; color:#ffffff; text-decoration:none; font-weight:bold;">
                Acessar o portal
              </a>
            </td>
          </tr>
        </table>
      </td>
    </tr>

    <!-- Assinatura -->
    <tr>
      <td style="padding:0 28px 28px;">
        <p style="margin:0; font-size:14.5px; color:#23262B; line-height:1.6;">
          Um abraço,<br>
          <strong>Daniel</strong><br>
          <span style="color:#5B5F68;">D.C English Classes</span>
        </p>
      </td>
    </tr>

    <!-- Rodapé -->
    <tr>
      <td style="background-color:#F7F9FC; padding:16px 28px; border-top:1px solid #E4EFF9;">
        <p style="margin:0; font-size:11.5px; color:#93A3C0; line-height:1.5;">
          Você está recebendo este e-mail porque tem uma conta no Portal do Aluno da D.C English Classes.
        </p>
      </td>
    </tr>

  </table>
</div>
